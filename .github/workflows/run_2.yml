name: Token Analysis - Run 2 (Append)

on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC — เผื่อ run 1 (เริ่ม 00:00 + limit 5.5 ชม.) จบก่อน
  workflow_dispatch:

# กันไม่ให้ run 1 กับ run 2 ทับกัน (แย่งกันอ่าน/เขียน sheet 'state')
concurrency:
  group: token-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      TIME_LIMIT_HOURS: '5.5'
      WRITE_MODE: 'append'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests gspread google-auth pyjwt python-dotenv

      - name: Write Secrets to Files
        env:
          GCP_CREDS: ${{ secrets.GCP_CREDENTIALS_JSON }}
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          python -c "import os; open('credentials.json', 'w').write(os.environ.get('GCP_CREDS', ''))"
          python -c "import os; open('.env', 'w').write(os.environ.get('ENV_FILE_CONTENT', ''))"

      - name: Run Cluster Analysis
        run: python cluster.py
