name: Token Analysis

# ออกแบบให้ "ตั้งแล้วลืม": จำนวน batch คิดจากจำนวน token จริงในชีต
# ทุกครั้งที่รัน — เพิ่ม/ลบ token ในชีต subscribetokens ได้เลย
# ไม่ต้องกลับมาแก้ไฟล์นี้อีก
on:
  schedule:
    - cron: '0 0 * * *' # 00:00 UTC (07:00 UTC+7) ทุกวัน
  workflow_dispatch:
    inputs:
      tokens_per_batch:
        description: 'จำนวน token ต่อ 1 job (ยิ่งน้อย job ยิ่งเยอะแต่สั้นลง)'
        required: false
        default: '60'
      max_parallel:
        description: 'จำนวน job ที่รันพร้อมกัน'
        required: false
        default: '3'

# กันไม่ให้รอบใหม่ทับรอบเก่าที่ยังทำงานอยู่
concurrency:
  group: token-analysis
  cancel-in-progress: false

env:
  TOKENS_PER_BATCH: ${{ inputs.tokens_per_batch || '60' }}
  SHEETS_WRITE_DELAY_MS: '1500'
  PYTHON_VERSION: '3.10'

jobs:
  # ── 1. วางแผน: นับ token แล้วสร้าง matrix ────────────────────────────
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      batches: ${{ steps.plan.outputs.batches }}
      batch_total: ${{ steps.plan.outputs.batch_total }}
      token_count: ${{ steps.plan.outputs.token_count }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install requests gspread google-auth pyjwt python-dotenv
      - name: Write Secrets to Files
        env:
          GCP_CREDS: ${{ secrets.GCP_CREDENTIALS_JSON }}
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          python -c "import os; open('credentials.json', 'w').write(os.environ.get('GCP_CREDS', ''))"
          python -c "import os; open('.env', 'w').write(os.environ.get('ENV_FILE_CONTENT', ''))"
      - id: plan
        run: python plan.py

  # ── 2. วิเคราะห์: หนึ่ง job ต่อหนึ่ง batch ───────────────────────────
  analyze:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    # batch ปกติ ~60 token × ~22 วิ ≈ 22 นาที — เผื่อไว้กว้างๆ
    timeout-minutes: 120
    strategy:
      # batch ที่พังต้องไม่ล้ม batch อื่น — ต่างคนต่างเขียนแท็บตัวเอง
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || '3') }}
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.batches) }}
    name: batch ${{ matrix.batch }}/${{ needs.plan.outputs.batch_total }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install requests gspread google-auth pyjwt python-dotenv
      - name: Write Secrets to Files
        env:
          GCP_CREDS: ${{ secrets.GCP_CREDENTIALS_JSON }}
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          python -c "import os; open('credentials.json', 'w').write(os.environ.get('GCP_CREDS', ''))"
          python -c "import os; open('.env', 'w').write(os.environ.get('ENV_FILE_CONTENT', ''))"

      # เหลื่อมเวลาเริ่มเล็กน้อย ไม่ให้ job ที่ขนานกันยิง API พร้อมกันเป๊ะ
      - name: Stagger start
        run: sleep $(( (RANDOM % 11) + 5 ))

      - name: Run batch ${{ matrix.batch }}
        env:
          BATCH_INDEX: ${{ matrix.batch }}
          BATCH_TOTAL: ${{ needs.plan.outputs.batch_total }}
          # ต่ำกว่า timeout-minutes ข้างบน เพื่อให้ flush ผลที่ค้างทันเสมอ
          TIME_LIMIT_HOURS: '1.75'
        run: python cluster.py

  # ── 3. รวมผล: ทุกแท็บ Batch_NN → ชีตหลัก ────────────────────────────
  merge:
    needs: [plan, analyze]
    # always() = batch บางตัวพังก็ยังรวมของที่เหลือ
    if: always() && needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install requests gspread google-auth pyjwt python-dotenv
      - name: Write Secrets to Files
        env:
          GCP_CREDS: ${{ secrets.GCP_CREDENTIALS_JSON }}
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          python -c "import os; open('credentials.json', 'w').write(os.environ.get('GCP_CREDS', ''))"
          python -c "import os; open('.env', 'w').write(os.environ.get('ENV_FILE_CONTENT', ''))"
      - name: Merge batch tabs
        run: python merge.py
